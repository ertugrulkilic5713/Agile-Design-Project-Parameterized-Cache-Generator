name: Cache tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Scala / Chisel tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cache-generator

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
          cache-dependency-path: |
            cache-generator/build.sbt
            cache-generator/project/build.properties

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run test suite
        run: sbt -batch test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: cache-generator/target/test-reports/
          if-no-files-found: ignore
