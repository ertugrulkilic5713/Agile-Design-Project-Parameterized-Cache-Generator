name: Cache and Wildcat tests

on:
  push:
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    name: Cache policies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cache-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
          cache-dependency-path: |
            cache-generator/build.sbt
            cache-generator/project/build.properties
      - uses: sbt/setup-sbt@v1
      - run: sbt -batch test
      - name: Check telemetry decoder
        working-directory: integration/UART_TB
        run: python3 -m unittest discover -v
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-test-reports
          path: cache-generator/target/test-reports/
          if-no-files-found: ignore
  wildcat:
    name: Wildcat and adapter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integration/wildcat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
          cache-dependency-path: |
            cache-generator/build.sbt
            cache-generator/project/build.properties
            integration/wildcat/build.sbt
            integration/wildcat/project/build.properties
      - uses: sbt/setup-sbt@v1
      - name: Run self-contained integration suites
        run: sbt -batch "testOnly adapter.* memory.DelayedMemSpec device.* wildcat.RegisterFileTest wildcat.DataMemoryStallTest wildcat.CachedProgramSpec"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wildcat-test-reports
          path: integration/wildcat/target/test-reports/
          if-no-files-found: error
